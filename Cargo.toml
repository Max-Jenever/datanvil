[workspace]
resolver = "2"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/your-org/your-project"

# Централизованное управление зависимостями
[workspace.dependencies]
# Внутренние крейты
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
contracts = { path = "crates/contracts" }
app_config = { path = "crates/app_config" }
telemetry = { path = "crates/telemetry" }

# Асинхронность и утилиты
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Инфраструктура (PostgreSQL, Redis, Kafka)
sqlx = { version = "0.8", features = [
  "runtime-tokio-rustls",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
rdkafka = { version = "0.36", features = ["dynamic-linking", "ssl"] }

# API и контракты
axum = "0.7"
tonic = "0.12"
prost = "0.13"

# Трейсинг и логирование
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.24"

# Конфигурация
config = "0.14"
